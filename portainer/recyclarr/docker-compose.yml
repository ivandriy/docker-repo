services:
  # syncs TRaSH Guides custom formats into Sonarr and Radarr once a day
  # config: /volume1/config/recyclarr/recyclarr.yml (copy of recyclarr.yml in this folder)
  recyclarr:
    image: ghcr.io/recyclarr/recyclarr:8.8.1
    container_name: recyclarr
    user: 1026:100
    environment:
      - TZ=Europe/Kyiv
      - CRON_SCHEDULE=@daily
      - SONARR_API_KEY=${SONARR_API_KEY}
      - RADARR_API_KEY=${RADARR_API_KEY}
    volumes:
      - /volume1/config/recyclarr:/config
    restart: unless-stopped

networks:
  default:
    name: containers_bridge
    external: true

substitutions:
  name: apollo-air-1-129d28
  friendly_name: Apollo AIR-1 129d28
packages:
  # Pinned to a release. Bump the tag on purpose, then rebuild.
  ApolloAutomation.AIR-1: github://ApolloAutomation/AIR-1/Integrations/ESPHome/AIR-1.yaml@26.10.8.1
esphome:
  name: ${name}
  name_add_mac_suffix: false
  friendly_name: ${friendly_name}
api:
  encryption:
    key: !secret apollo_air_1_api_key

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
# OTA is encrypted with the API key (ESPHome 2026.9+). The package's
# password-based entry is removed; losing the API key means a serial flash.
ota:
  - id: !remove ota_esphome
  - platform: esphome
    id: ota_encrypted
    encryption: {}

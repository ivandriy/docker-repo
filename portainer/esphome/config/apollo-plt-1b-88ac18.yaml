substitutions:
  name: apollo-plt-1b-88ac18
  friendly_name: Apollo Plant Sensor
packages:
  # Pinned to a release. Bump the tag on purpose, then rebuild.
  ApolloAutomation.PLT-1B: github://ApolloAutomation/PLT-1/Integrations/ESPHome/PLT-1B_Minimal.yaml@26.3.2.1
esphome:
  name: ${name}
  name_add_mac_suffix: false
  friendly_name: ${friendly_name}
api:
  encryption:
    key: !secret apollo_plt_1b_api_key
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# OTA is encrypted with the API key (ESPHome 2026.9+). The package's
# password-free entry is removed; losing the API key means a serial flash.
ota:
  - id: !remove ota_esphome
  - platform: esphome
    id: ota_encrypted
    encryption: {}

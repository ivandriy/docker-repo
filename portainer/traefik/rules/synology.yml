http:
  routers:
    synology:
      entryPoints:
        - "https"
      service: synology
      middlewares:
        - whitelist
      rule: Host(`synology.{{ env "LOCAL_DOMAIN" }}`)
      tls:
        certResolver: mydnschallenge
        domains:
          - main: '{{ env "LOCAL_DOMAIN" }}'
            sans:
              - '*.{{ env "LOCAL_DOMAIN" }}'
  services:
    synology:
      loadBalancer:
        serversTransport: synology-insecure
        passHostHeader: true
        servers:
        - url: {{ expandenv "https://$SYNOLOGY_HOST" }}
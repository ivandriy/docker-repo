---
global:
  checkNewVersion: true
  sendAnonymousUsage: false
certificatesResolvers:
  mydnschallenge:
    acme:
      dnsChallenge:
        propagation:
          delayBeforeChecks: 10s
          disableChecks: true
        provider: digitalocean
        resolvers:
          - "1.1.1.1:53"
          - "8.8.8.8:53"
      email: andrii@ivanskiy.com
      storage: ./letsencrypt/acme.json
entryPoints:
  http:
    address: ":80"
  https:
    address: ":443"
    transport:
      respondingTimeouts:
        readTimeout: 600s
        idleTimeout: 600s
        writeTimeout: 600s	
  ping:
    address: ":8082"
log:
  level: INFO
providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
  file:
    directory: /rules
    watch: true
api:
  insecure: false
  dashboard: true
ping:
  entryPoint: ping

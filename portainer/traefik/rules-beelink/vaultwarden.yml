# Beelink instance only, copied to /opt/portainer/volumes/traefik/rules/vaultwarden.yml.
# Vaultwarden (portainer/vaultwarden/docker-compose.beelink.yml), LAN/VPN only.
# Both AdGuards rewrite vault.local to 192.168.1.131, so it works with the NAS off.
# hsts, not secure-headers: Vaultwarden sends its own CSP and frame headers.
http:
  routers:
    vaultwarden:
      entryPoints:
        - "https-lan"
      service: vaultwarden
      middlewares:
        - vault-allow
        - hsts
      rule: Host(`vault.{{ env "LOCAL_DOMAIN" }}`)
      tls:
        certResolver: mydnschallenge
        domains:
          - main: '{{ env "LOCAL_DOMAIN" }}'
            sans:
              - '*.{{ env "LOCAL_DOMAIN" }}'

  middlewares:
    # whitelist@file plus the Beelink Uptime Kuma, whose requests arrive from
    # its compose network (uptime-kuma_default, 172.24.0.0/16 since 2026-11-08).
    # If that stack's network is ever recreated, check the subnet again.
    vault-allow:
      ipAllowList:
        sourceRange:
          - "192.168.1.0/24"
          - "192.168.3.0/24"
          - "192.168.4.0/24"
          - "172.24.0.0/16"

  services:
    vaultwarden:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: "http://127.0.0.1:8085"

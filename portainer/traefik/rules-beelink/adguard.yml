# Beelink instance only, copied to /opt/portainer/volumes/traefik/rules/adguard.yml.
# Served by the Beelink itself on https-lan, so the Beelink AdGuard UI works with the NAS off.
# Both AdGuards rewrite adguard2.local to 192.168.1.131.
http:
  routers:
    adguard2:
      entryPoints:
        - "https-lan"
      service: adguard2
      middlewares:
        - whitelist
      rule: Host(`adguard2.{{ env "LOCAL_DOMAIN" }}`)
      tls:
        certResolver: mydnschallenge
        domains:
          - main: '{{ env "LOCAL_DOMAIN" }}'
            sans:
              - '*.{{ env "LOCAL_DOMAIN" }}'

  services:
    adguard2:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: "http://192.168.1.131:9080"

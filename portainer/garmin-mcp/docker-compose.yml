# Beelink only. Garmin Personal MCP (https://github.com/Mason-Levyy/garmin-personal-mcp),
# read-only access to Garmin Connect through Garmin's official Personal API.
# The server has no authentication: the port stays on 127.0.0.1 and the Beelink Traefik
# serves it at https://garmin.local.ivanskiy.com/mcp behind the LAN/VPN whitelist
# (portainer/traefik/rules-beelink/garmin.yml).
# Stack env in Portainer: GARMIN_PERSONAL_API_KEY, from
# https://connect.garmin.com/app/settings/personalApiToken (expires after 30 days to a year),
# TELEGRAM_BOT_TOKEN (from @BotFather) and TELEGRAM_CHAT_ID for garmin-report.
services:
  garmin-mcp:
    image: ghcr.io/mason-levyy/garmin-personal-mcp:0.2.0
    container_name: garmin-mcp
    command: ["--http", "--host", "0.0.0.0", "--allowed-host", "garmin.local.ivanskiy.com"]
    restart: unless-stopped
    mem_limit: 256m
    cpu_shares: 256
    security_opt:
      - no-new-privileges=true
    read_only: true
    tmpfs:
      - /tmp
    environment:
      TZ: 'Europe/Kyiv'
      GARMIN_PERSONAL_API_KEY: ${GARMIN_PERSONAL_API_KEY}
    ports:
      - "127.0.0.1:8491:8491"
    volumes:
      # bearer-token cache
      - garmin-config:/home/garmin/.config/garmin
      # files saved by garmin_download_activity
      - garmin-downloads:/home/garmin/Downloads/garmin

  # Every Sunday at REPORT_TIME sends the week (Monday to now) to Telegram: a short digest and the
  # full Markdown report for ChatGPT, with HR zones and swim intervals from each activity's FIT file.
  # The first run covers 28 days. Built from weekly-report/ on each Portainer redeploy.
  # Send one now: docker exec garmin-report python -u /app/report.py --now
  garmin-report:
    build: ./weekly-report
    image: garmin-report:local
    container_name: garmin-report
    restart: unless-stopped
    depends_on:
      - garmin-mcp
    mem_limit: 128m
    cpu_shares: 128
    security_opt:
      - no-new-privileges=true
    read_only: true
    environment:
      TZ: 'Europe/Kyiv'
      REPORT_WEEKDAY: '6'
      REPORT_TIME: '19:00'
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
    volumes:
      # FIT files that garmin-mcp downloads
      - garmin-downloads:/fit:ro
      # first-run flag and the last HR zone settings
      - garmin-report-state:/state

volumes:
  garmin-config:
  garmin-downloads:
  garmin-report-state:

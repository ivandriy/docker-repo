version: "3.8"
services:
  jackett:
    image: linuxserver/jackett:latest
    container_name: jackett
    environment:
      - PUID=1026
      - PGID=100
      - TZ=Europe/Kiev
    volumes:
      - /volume1/docker/jackett:/config
    ports:
      - 9117:9117
    restart: unless-stopped
    labels:
      # proxy settings    
      - "traefik.enable=true"    
      - "traefik.http.routers.jackett.entrypoints=https"
      - "traefik.http.routers.jackett.rule=Host(`jackett.${LOCAL_DOMAIN}`)"
      - "traefik.http.routers.jackett.middlewares=whitelist@file"
      - "traefik.http.routers.jackett.tls=true"
      - "traefik.http.routers.jackett.tls.certresolver=mydnschallenge"
      - "traefik.http.routers.jackett.tls.domains[0].main=${LOCAL_DOMAIN}"
      - "traefik.http.routers.jackett.tls.domains[0].sans=*.${LOCAL_DOMAIN}"
      # homepage integration      
      - homepage.group=Media
      - homepage.name=Jackett
      - homepage.icon=jackett.png
      - homepage.href=https://jackett.${LOCAL_DOMAIN}
      # no widget: Jackett has an admin password, and its indexers are disabled until
      # the stack is retired (plans/prowlarr-migration.md, phase 4)
      - homepage.description=Torrent indexer (retiring)
      # auto update docker
      - "com.centurylinklabs.watchtower.enable=true"
# FlareSolverr moved to the prowlarr stack; Jackett still uses http://flaresolverr:8191
networks:
  default:
    name: containers_bridge
    external: true
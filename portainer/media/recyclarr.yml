# yaml-language-server: $schema=https://schemas.recyclarr.dev/latest/config-schema.json
#
# Live copy: /volume1/config/recyclarr/recyclarr.yml on the NAS. Edit here, then copy it over.
#
# TRaSH Guides custom formats on the existing quality profiles, with our own scores.
# The Ukrainian formats are ours, not from the guide. They are excluded from the score
# reset and their scores are set by hand in the arrs:
#   Sonarr  UkrLanguage_3                     +1000 in every profile
#   Radarr  Release with Ukrainian language   +5000 HD-1080p, +50000 Ultra-HD (min score 50000)
# Both are higher than any total the guide formats below can reach (Sonarr about 400,
# Radarr about 4600). HD-1080p stays under its 9999 cutoff score so upgrades continue.
# Quality lists, cutoffs and upgrade settings are not managed here.

sonarr:
  sonarr:
    base_url: http://sonarr:8989
    api_key: !env_var SONARR_API_KEY
    delete_old_custom_formats: false

    quality_profiles:
      - name: Any
        reset_unmatched_scores: &sonarr_keep
          enabled: true
          except: [UkrLanguage_3]
      - name: SD
        reset_unmatched_scores: *sonarr_keep
      - name: HD-720p
        reset_unmatched_scores: *sonarr_keep
      - name: HD-1080p
        reset_unmatched_scores: *sonarr_keep
      - name: Ultra-HD
        reset_unmatched_scores: *sonarr_keep
      - name: HD - 720p/1080p
        reset_unmatched_scores: *sonarr_keep

    custom_formats:
      # streaming services

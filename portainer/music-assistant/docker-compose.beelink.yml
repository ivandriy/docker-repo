# Music Assistant on the Beelink. Web UI http://192.168.1.131:8095, and
# https://music.local.ivanskiy.com through the Beelink Traefik
# (traefik/rules-beelink/music-assistant.yml), LAN/VPN only.
#
# Host network: AirPlay, Chromecast, Sonos and DLNA discovery need mDNS, and
# players pull audio straight from the stream server on 8097, not via Traefik.
#
# Pinned and left out of Watchtower: the Home Assistant integration checks the
# server schema, so bump the tag by hand and check HA still connects.
#
# HA integration: Settings > Devices & services > Music Assistant,
# URL http://192.168.1.131:8095
services:
  music-assistant:
    image: ghcr.io/music-assistant/server:2.10.9
    container_name: music-assistant
    restart: unless-stopped
    network_mode: host
    volumes:
      - /opt/portainer/volumes/music-assistant/data:/data
      # NAS music share, already mounted read-only on the host (CIFS automount,
      # same as Plex). Add it in MA as a "Filesystem (local disk)" provider.
      - /mnt/nas_media/Music:/media/music:ro
    environment:
      LOG_LEVEL: info
      TZ: Europe/Kyiv
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

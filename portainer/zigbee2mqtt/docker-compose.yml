services:
  zigbee2mqtt:
    container_name: zigbee2mqtt
    image: koenkk/zigbee2mqtt:${Z2M_VERSION}
    restart: unless-stopped
    volumes:
      - ${VOLUME_DATA}/zigbee2mqtt:/app/data
    ports:
      - ${Z2M_HTTP_PORT}:8080
    environment:
      - TZ=Europe/Kiev
    privileged: true
    depends_on:
       - mosquitto
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 2m
    labels:
      # homepage integration
      - homepage.group=Smart home
      - homepage.name=Zigbee2MQTT
      - homepage.icon=zigbee2mqtt.png
      - homepage.href=https://z2mqtt.${LOCAL_DOMAIN}
      - homepage.description=Zigbee to MQTT
      # auto update docker
      - "com.centurylinklabs.watchtower.monitor-only=true"

  mosquitto:
    image: eclipse-mosquitto:${MQTT_VERSION}
    hostname: mosquitto
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - ${MQTT_PORT1}:1883
      - ${MQTT_PORT2}:9001
    privileged: true
    volumes:
      - ${VOLUME_DATA}/mosquitto:/etc/mosquitto
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -t '$$SYS/broker/uptime' -C 1 -W 5"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      # auto update docker
      - "com.centurylinklabs.watchtower.monitor-only=true"

networks:
  default:
    name: containers_bridge
    external: true
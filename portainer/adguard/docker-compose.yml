services:
  adguardhome:
    image: adguard/adguardhome
    container_name: adguardhome
    restart: unless-stopped
    mem_limit: 2g
    cpu_shares: 768
    environment:
      TZ: 'Europe/Kyiv'
    volumes:
      - ${VOLUME_DATA}/adguard-home/work:/opt/adguardhome/work
      - ${VOLUME_DATA}/adguard-home/confdir:/opt/adguardhome/conf
    network_mode: host
    healthcheck:
      test: ["CMD-SHELL", "nslookup uptime-kuma.local.ivanskiy.com 127.0.0.1 > /dev/null"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
# Watchdog for the NAS monitoring stack. Kuma, Grafana and Prometheus all run on the
# NAS, so nothing there can report the NAS itself being down; HA on the Beelink can.
# A failed request makes the entity unavailable (multiscrape coordinator), a wrong
# body makes it off. automation.nas_monitoring_watchdog pushes to the phone.
# Live copy: /opt/portainer/volumes/homeassistant/packages/nas_watchdog.yaml on the
# Beelink (folder is root-owned: write it through `docker exec homeassistant`).
# After editing: multiscrape.reload, no restart needed.
multiscrape:
  - name: NAS Uptime Kuma check
    resource: http://192.168.1.254:3001/api/entry-page
    scan_interval: 60
    timeout: 10
    binary_sensor:
      - unique_id: nas_uptime_kuma_up
        name: NAS Uptime Kuma
        device_class: connectivity
        value_template: "{{ value_json.type == 'entryPage' }}"

  - name: NAS Grafana check
    resource: http://192.168.1.254:3340/api/health
    scan_interval: 60
    timeout: 10
    binary_sensor:
      - unique_id: nas_grafana_up
        name: NAS Grafana
        device_class: connectivity
        value_template: "{{ value_json.database == 'ok' }}"

  - name: NAS Prometheus check
    resource: http://192.168.1.254:9090/-/healthy
    scan_interval: 60
    timeout: 10
    binary_sensor:
      - unique_id: nas_prometheus_up
        name: NAS Prometheus
        device_class: connectivity
        value_template: "{{ 'Healthy' in value }}"

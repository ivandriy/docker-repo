# Library names must match the Plex library names. "default:" entries are Kometa's built-in sets.
libraries:
  Movies:
    remove_overlays: false
    collection_files:
    - file: config/Movies.yml
    - default: basic
    - default: imdb
    - default: oscars
    - default: resolution
    - default: decade
    - default: director
    - default: genre
    overlay_files:
    - default: ribbon              # includes the IMDb Top 250 ribbon
    - default: video_format
    - default: resolution
    - default: audio_codec
  Mults:
    remove_overlays: false
    collection_files:
    - default: basic
    - default: imdb
    - default: oscars
    - default: resolution
    overlay_files:
    - default: ribbon
    - default: video_format
    - default: resolution
    - default: audio_codec
  Series:
    remove_overlays: false
    collection_files:
    - default: basic
    - default: imdb
    - default: golden
    - default: emmy
    - default: genre
    overlay_files:
    - default: ribbon
    - default: streaming           # show level: streaming can't run per season
    - default: audio_codec
      template_variables:
        overlay_level: season
    - default: resolution
      template_variables:
        overlay_level: season
    - default: video_format
      template_variables:
        overlay_level: season
playlist_files:
- default: playlist
settings:
  cache: true
  cache_expiration: 60
  asset_directory: config/assets
  asset_folders: true
  asset_depth: 0
  create_asset_folders: false
  dimensional_asset_rename: false
  download_url_assets: false
  show_missing_season_assets: false
  show_missing_episode_assets: false
  show_asset_not_needed: true
  sync_mode: append
  minimum_items: 1
  default_collection_order:
  delete_below_minimum: true
  delete_not_scheduled: false
  run_again_delay: 2
  missing_only_released: false
  only_filter_missing: false
  show_unmanaged: true
  show_filtered: false
  show_options: false
  show_missing: true
  show_missing_assets: true
  save_report: true
  tvdb_language: eng
  ignore_ids:
  ignore_imdb_ids:
  item_refresh_delay: 0
  playlist_sync_to_users: all
  verify_ssl: true
  prioritize_assets: false
  playlist_report: true
  custom_repo:
  check_nightly: false
  show_unconfigured: true
  playlist_exclude_users:
  run_order:
  - operations
  - metadata
  - collections
  - overlays
  overlay_artwork_filetype: jpg
  overlay_artwork_quality:
  show_unfiltered: false
  auto_sort_hubs:
webhooks:
  error:
  run_start:
  run_end:
  changes:
    version:
  version:
  delete:
plex:
  url: http://192.168.1.131:32400
  token: <<plextoken>>
  timeout: 60
  clean_bundles: false
  empty_trash: false
  optimize: false
  db_cache:
  verify_ssl:
tmdb:
  apikey: <<tmdbkey>>
  language: en
  cache_expiration: 60
  region:
radarr:
  url: http://192.168.1.254:7878
  token: <<radarrkey>>
  add_missing: false
  add_existing: false
  root_folder_path: /Data/Media/Movies
  monitor: false
  availability: announced
  quality_profile: Ultra-HD
  tag: pmm
  search: false
  radarr_path:
  plex_path:
  upgrade_existing: false
  ignore_cache: false
  monitor_existing: false
sonarr:
  url: http://192.168.1.254:8989
  token: <<sonarrkey>>
  add_missing: false
  add_existing: false
  root_folder_path: /Data/Media/Series
  monitor: none
  quality_profile: Ultra-HD
  language_profile: English
  series_type: standard
  season_folder: true
  tag: pmm
  search: false
  cutoff_search: false
  sonarr_path:
  plex_path:
  upgrade_existing: false
  ignore_cache: false
  monitor_existing: false

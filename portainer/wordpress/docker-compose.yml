version: '3'

networks:
  default:
    name: containers_bridge
    external: true  

services:
  wordpress:
    build:
      context: ./wp
    container_name: wordpress
    restart: always
    environment:
      WORDPRESS_DB_HOST: wp-mariadb:3306
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
      WORDPRESS_TABLE_PREFIX: ${WORDPRESS_TABLE_PREFIX}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_REDIS_HOST', 'wp-redis');
        define('WP_REDIS_PORT', 6379);
        define('FS_METHOD', 'direct');
        define('WP_HOME', 'https://${TRAEFIK_WORDPRESS}');
        define('WP_SITEURL', 'https://${TRAEFIK_WORDPRESS}');
        define('WP_AUTO_UPDATE_CORE', 'minor');
    volumes:
      # Old Bitnami data stays in /volume1/docker/wordpress/data for rollback
      - /volume1/docker/wordpress/html:/var/www/html
    depends_on:
        - wp-mariadb
        - wp-redis
    labels:
      # The labels are usefull for Traefik only
      - "traefik.enable=true"
      - "traefik.http.routers.wordpress.rule=Host(`${TRAEFIK_WORDPRESS}`) || Host(`www.${TRAEFIK_WORDPRESS}`)"
      - "traefik.http.routers.wordpress.service=wordpress"
      - "traefik.http.routers.wordpress.entrypoints=https"
      - "traefik.http.services.wordpress.loadbalancer.server.port=80"
      - "traefik.http.routers.wordpress.tls=true"
      - "traefik.http.routers.wordpress.tls.certresolver=mydnschallenge"
      - "traefik.http.services.wordpress.loadbalancer.passhostheader=true"
      - "traefik.http.routers.wordpress.middlewares=wwwremove,compresstraefik,secure-headers@file"
      - "traefik.http.middlewares.compresstraefik.compress=true"

      # Watchtower Update
      - "com.centurylinklabs.watchtower.enable=false"      

  wp-mariadb:
    build:
      context: ./db
    restart: always
    container_name: wp-mariadb
    ports:
      - "3306:3306"
    environment:
      MARIADB_DATABASE: ${WORDPRESS_DB_NAME}
      MARIADB_USER: ${WORDPRESS_DB_USER}
      MARIADB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${WORDPRESS_DB_ADMIN_PASSWORD}
      MARIADB_CHARACTER_SET: utf8
      MARIADB_COLLATE: utf8_unicode_ci
    volumes:
      - /volume1/docker/wordpress/db:/bitnami/mariadb
    labels:
      # Watchtower Update
      - "com.centurylinklabs.watchtower.enable=false"         

  wp-redis:
    image: redis:latest
    restart: always
    container_name: wp-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "no", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    labels:
      # Watchtower Update
      - "com.centurylinklabs.watchtower.enable=false"
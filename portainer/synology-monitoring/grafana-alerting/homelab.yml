# Grafana-managed alert rules, file-provisioned. Read-only in the Grafana UI.
# Live copy: /volume1/docker/synology-monitoring/grafana-alerting/homelab.yml on the NAS,
# mounted at /etc/grafana/provisioning/alerting. Copy edits there, then reload with
#   POST /api/admin/provisioning/alerting/reload  (or restart Grafana).
# Notifications go to the default route (Telegram contact point).
# Every expression returns a value for every series, so "no data" means the exporter
# is gone; TargetDown covers that, and noDataState is OK everywhere.
# execErrState is KeepLast: with Prometheus down every rule would otherwise send its
# own DatasourceError. A dead Prometheus is reported by Uptime Kuma and by the HA
# watchdog (automation.nas_monitoring_watchdog) instead.
# Datasource cdup605h5snpce is the "prometheus" datasource.
# Planned NAS shutdowns: rules that a shutdown or the boot after it would trip end with
#   unless on() (max_over_time(hass_input_boolean_state{entity="input_boolean.nas_planned_off"}[30m]) == 1)
# so they go quiet while HA's input_boolean.nas_planned_off is on and for 30 min after it
# clears (HA clears it as soon as DSM answers, before the CIFS mount and exporters settle).
# If HA or its scrape is down the right side is empty and the rules work as before.
# Label mute: watchtower routes a rule through the Watchtower mute timings in policies.yml.
apiVersion: 1
groups:
  - orgId: 1
    name: homelab
    folder: Alerts
    interval: 1m
    rules:
      - uid: homelab-target-down
        title: TargetDown
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: cdup605h5snpce
            model:
              expr: '(up) unless on() (max_over_time(hass_input_boolean_state{entity="input_boolean.nas_planned_off"}[30m]) == 1)'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: C
              conditions:
                - evaluator: { type: lt, params: [1] }
        for: 5m
        noDataState: OK
        execErrState: KeepLast
        labels: { severity: critical, mute: watchtower }
        annotations:
          summary: "Prometheus can't scrape {{ $labels.job }} at {{ $labels.instance }}"

      - uid: homelab-nas-raid
        title: NasRaidNotNormal
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: cdup605h5snpce
            model:
              # Synology raidStatus: 1 Normal, anything else is repairing, degraded or crashed
              expr: '(raidStatus != bool 1) unless on() (max_over_time(hass_input_boolean_state{entity="input_boolean.nas_planned_off"}[30m]) == 1)'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: C
              conditions:
                - evaluator: { type: gt, params: [0] }
        for: 2m
        noDataState: OK
        execErrState: KeepLast
        labels: { severity: critical }
        annotations:
          summary: "NAS {{ $labels.raidName }} is not Normal. Check Storage Manager."

      - uid: homelab-nas-disk
        title: NasDiskProblem
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: cdup605h5snpce
            model:
              # diskStatus and diskHealthStatus: 1 is Normal. diskBadSector is -1 on SSDs.
              expr: '((diskStatus != bool 1) + (diskHealthStatus != bool 1) + (diskBadSector > bool 0)) unless on() (max_over_time(hass_input_boolean_state{entity="input_boolean.nas_planned_off"}[30m]) == 1)'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: C
              conditions:
                - evaluator: { type: gt, params: [0] }
        for: 5m
        noDataState: OK
        execErrState: KeepLast
        labels: { severity: critical }
        annotations:
          summary: "NAS {{ $labels.diskID }} reports a bad status, failing health or bad sectors"

      - uid: homelab-nas-disk-hot
        title: NasDiskHot
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: cdup605h5snpce
            model:
              expr: diskTemperature
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: C
              conditions:
                - evaluator: { type: gt, params: [50] }
        for: 10m
        noDataState: OK
        execErrState: KeepLast
        labels: { severity: warning }
        annotations:
          summary: "NAS {{ $labels.diskID }} is at {{ $values.A.Value }} °C"

      - uid: homelab-nas-ssd-wear
        title: NasSsdWearing
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: cdup605h5snpce
            model:
              # Only SSDs report remaining life; HDDs report -1.
              expr: diskRemainLife >= 0
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: C
              conditions:
                - evaluator: { type: lt, params: [20] }
        for: 1h
        noDataState: OK
        execErrState: KeepLast
        labels: { severity: warning }
        annotations:
          summary: "NAS {{ $labels.diskID }} has {{ $values.A.Value }}% life left. Plan a replacement."

      - uid: homelab-nas-volume-full
        title: NasVolumeFull
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: cdup605h5snpce
            model:
              # Volumes only: Storage Pool free space is unallocated pool space.
              expr: 100 * (1 - raidFreeSize{raidName=~"Volume.*"} / raidTotalSize{raidName=~"Volume.*"})
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: C
              conditions:
                - evaluator: { type: gt, params: [85] }
        for: 30m
        noDataState: OK
        execErrState: KeepLast
        labels: { severity: warning }
        annotations:
          summary: "NAS {{ $labels.raidName }} is {{ printf \"%.0f\" $values.A.Value }}% full"

      - uid: homelab-nas-system
        title: NasSystemFault
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: cdup605h5snpce
            model:
              # 1 is Normal for all four: system, power supply, system fan, CPU fan
              expr: '((systemStatus != bool 1) + (powerStatus != bool 1) + (systemFanStatus != bool 1) + (cpuFanStatus != bool 1)) unless on() (max_over_time(hass_input_boolean_state{entity="input_boolean.nas_planned_off"}[30m]) == 1)'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: C
              conditions:
                - evaluator: { type: gt, params: [0] }
        for: 5m
        noDataState: OK
        execErrState: KeepLast
        labels: { severity: critical }
        annotations:
          summary: "NAS reports a system, power or fan fault. Check DSM Info Center."

      - uid: homelab-nas-ups
        title: NasUpsOnBattery
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: cdup605h5snpce
            model:
              # Info metric: the status is in the label. "OL" is on line.
              expr: '(upsInfoStatus{upsInfoStatus!~"OL.*"}) unless on() (max_over_time(hass_input_boolean_state{entity="input_boolean.nas_planned_off"}[30m]) == 1)'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: C
              conditions:
                - evaluator: { type: gt, params: [0] }
        for: 1m
        noDataState: OK
        execErrState: KeepLast
        labels: { severity: critical }
        annotations:
          summary: "NAS UPS status is {{ $labels.upsInfoStatus }}"

      - uid: homelab-beelink-disk-full
        title: BeelinkDiskFull
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: cdup605h5snpce
            model:
              expr: 100 * (1 - node_filesystem_avail_bytes{instance="192.168.1.131:9100",mountpoint=~"/|/boot"} / node_filesystem_size_bytes{instance="192.168.1.131:9100",mountpoint=~"/|/boot"})
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: C
              conditions:
                - evaluator: { type: gt, params: [85] }
        for: 15m
        noDataState: OK
        execErrState: KeepLast
        labels: { severity: warning }
        annotations:
          summary: "Beelink {{ $labels.mountpoint }} is {{ printf \"%.0f\" $values.A.Value }}% full"

      - uid: homelab-beelink-hot
        title: BeelinkCpuHot
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: cdup605h5snpce
            model:
              expr: max by (instance) (node_hwmon_temp_celsius{instance="192.168.1.131:9100",chip="platform_coretemp_0"})
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: C
              conditions:
                - evaluator: { type: gt, params: [90] }
        for: 10m
        noDataState: OK
        execErrState: KeepLast
        labels: { severity: warning }
        annotations:
          summary: "Beelink CPU is at {{ $values.A.Value }} °C"

      - uid: homelab-beelink-media-mount
        title: BeelinkMediaMountMissing
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: cdup605h5snpce
            model:
              # Plex reads media over this CIFS mount. Also fires while the Beelink
              # node exporter is down; TargetDown names that case.
              expr: '(absent(node_filesystem_size_bytes{instance="192.168.1.131:9100",mountpoint="/mnt/nas_media"})) unless on() (max_over_time(hass_input_boolean_state{entity="input_boolean.nas_planned_off"}[30m]) == 1)'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: C
              conditions:
                - evaluator: { type: gt, params: [0] }
        for: 5m
        noDataState: OK
        execErrState: KeepLast
        labels: { severity: warning }
        annotations:
          summary: "Beelink lost the NAS media mount /mnt/nas_media. Plex can't read media."

      - uid: homelab-watchtower-update-failed
        title: WatchtowerUpdateFailed
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: cdup605h5snpce
            model:
              # Gauge from the last nightly scan, so it stays firing until the next scan
              expr: max by (instance) (watchtower_containers_failed)
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: C
              conditions:
                - evaluator: { type: gt, params: [0] }
        for: 1m
        noDataState: OK
        execErrState: KeepLast
        labels: { severity: warning }
        annotations:
          summary: "Watchtower on {{ $labels.instance }} failed to update {{ $values.A.Value }} container(s) in its last scan"

      - uid: homelab-watchtower-scan-failed
        title: WatchtowerScanFailed
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: cdup605h5snpce
            model:
              expr: max by (instance) (increase(watchtower_scans_failed_total[1h]))
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: C
              conditions:
                - evaluator: { type: gt, params: [0] }
        for: 1m
        noDataState: OK
        execErrState: KeepLast
        labels: { severity: warning }
        annotations:
          summary: "Watchtower on {{ $labels.instance }} had a failed scan in the last hour"

      - uid: homelab-hyperbackup-stale
        title: HyperBackupStale
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: cdup605h5snpce
            model:
              # Hours past the allowed age (36 h daily, 8 days weekly, from the exporter)
              expr: (time() - hyperbackup_last_success_timestamp_seconds - hyperbackup_max_age_seconds) / 3600
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: C
              conditions:
                - evaluator: { type: gt, params: [0] }
        for: 30m
        noDataState: OK
        execErrState: KeepLast
        labels: { severity: critical }
        annotations:
          summary: "Hyper Backup \"{{ $labels.name }}\" ({{ $labels.schedule }}) has not succeeded for {{ printf \"%.0f\" $values.A.Value }} h past its limit"

      - uid: homelab-hyperbackup-failed
        title: HyperBackupFailed
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: cdup605h5snpce
            model:
              expr: hyperbackup_last_run_ok
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: C
              conditions:
                - evaluator: { type: lt, params: [1] }
        for: 5m
        noDataState: OK
        execErrState: KeepLast
        labels: { severity: critical }
        annotations:
          summary: "Hyper Backup \"{{ $labels.name }}\" failed its last run"

      # Jobs reporting to job-heartbeat (job-heartbeat.py, jobs.json). A job that has never
      # reported has no last-run series, so it shows "never" on the dashboard but does not alert.
      - uid: homelab-job-overdue
        title: ScheduledJobOverdue
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: cdup605h5snpce
            model:
              # Hours past the job's allowed age since its last finished run
              expr: (time() - homelab_job_last_run_timestamp_seconds - homelab_job_max_age_seconds) / 3600
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: C
              conditions:
                - evaluator: { type: gt, params: [0] }
        for: 30m
        noDataState: OK
        execErrState: KeepLast
        labels: { severity: warning }
        annotations:
          summary: "Job {{ $labels.job_name }} on {{ $labels.host }} ({{ $labels.schedule }}) has not reported a run for {{ printf \"%.0f\" $values.A.Value }} h past its limit"

      - uid: homelab-job-failed
        title: ScheduledJobFailed
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 1800, to: 0 }
            datasourceUid: cdup605h5snpce
            model:
              expr: |
                homelab_job_last_status
                unless on() (max_over_time(hass_input_boolean_state{entity="input_boolean.nas_planned_off"}[30m]) == 1)
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: C
              conditions:
                - evaluator: { type: lt, params: [1] }
        for: 1m
        noDataState: OK
        execErrState: KeepLast
        labels: { severity: critical }
        annotations:
          summary: "Job {{ $labels.job_name }} on {{ $labels.host }} failed its last run"

      - uid: homelab-traefik-cert-expiring
        title: TraefikCertExpiring
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: cdup605h5snpce
            model:
              # Days left on each certificate Traefik serves. Let's Encrypt renews at 30 days,
              # so under 20 means renewal has failed for 10 days.
              expr: "min by (host, cn) ((traefik_tls_certs_not_after - time()) / 86400)"
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: C
              conditions:
                - evaluator: { type: lt, params: [20] }
        for: 1h
        noDataState: OK
        execErrState: KeepLast
        labels: { severity: warning }
        annotations:
          summary: "Traefik ({{ $labels.host }}) certificate {{ $labels.cn }} expires in {{ printf \"%.0f\" $values.A.Value }} days. Let's Encrypt renewal is failing; check the Traefik log."

      - uid: homelab-traefik-5xx
        title: Traefik5xxHigh
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: cdup605h5snpce
            model:
              # Percent of 5xx answers per service over 15 min; clamp_min keeps idle services quiet.
              # The 5xx series only exists after a service's first 5xx, so "or ... * 0" gives 0 before that.
              expr: "((sum by (host, service) (rate(traefik_service_requests_total{code=~\"5..\"}[15m])) or sum by (host, service) (rate(traefik_service_requests_total[15m])) * 0) / clamp_min(sum by (host, service) (rate(traefik_service_requests_total[15m])), 0.02) * 100) unless on() (max_over_time(hass_input_boolean_state{entity=\"input_boolean.nas_planned_off\"}[30m]) == 1)"
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: C
              conditions:
                - evaluator: { type: gt, params: [20] }
        for: 15m
        noDataState: OK
        execErrState: KeepLast
        labels: { severity: warning, mute: watchtower }
        annotations:
          summary: "Traefik ({{ $labels.host }}) service {{ $labels.service }} answers {{ printf \"%.0f\" $values.A.Value }}% with 5xx"

      - uid: homelab-probe-http
        title: HttpsProbeFailed
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: cdup605h5snpce
            model:
              expr: "(probe_success{job=\"blackbox-http\"}) unless on() (max_over_time(hass_input_boolean_state{entity=\"input_boolean.nas_planned_off\"}[30m]) == 1)"
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: C
              conditions:
                - evaluator: { type: lt, params: [1] }
        for: 5m
        noDataState: OK
        execErrState: KeepLast
        labels: { severity: critical, mute: watchtower }
        annotations:
          summary: "{{ $labels.instance }} does not answer 2xx over HTTPS"

      - uid: homelab-probe-cert
        title: SiteCertExpiring
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: cdup605h5snpce
            model:
              expr: "(probe_ssl_earliest_cert_expiry{job=\"blackbox-http\"} - time()) / 86400"
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: C
              conditions:
                - evaluator: { type: lt, params: [20] }
        for: 1h
        noDataState: OK
        execErrState: KeepLast
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.instance }} certificate expires in {{ printf \"%.0f\" $values.A.Value }} days"

      - uid: homelab-probe-dns
        title: DnsProbeFailed
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: cdup605h5snpce
            model:
              # A query for google.com against each AdGuard; looks like "the internet is down"
              expr: "(probe_success{job=\"blackbox-dns\"}) unless on() (max_over_time(hass_input_boolean_state{entity=\"input_boolean.nas_planned_off\"}[30m]) == 1)"
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: C
              conditions:
                - evaluator: { type: lt, params: [1] }
        for: 3m
        noDataState: OK
        execErrState: KeepLast
        labels: { severity: critical, mute: watchtower }
        annotations:
          summary: "AdGuard on {{ $labels.host }} ({{ $labels.instance }}) does not answer DNS"

      - uid: homelab-adguard-protection-off
        title: AdGuardProtectionOff
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: cdup605h5snpce
            model:
              expr: "adguard_protection_enabled"
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: C
              conditions:
                - evaluator: { type: lt, params: [1] }
        for: 30m
        noDataState: OK
        execErrState: KeepLast
        labels: { severity: warning }
        annotations:
          summary: "AdGuard on {{ $labels.host }} has had filtering off for 30 min"

global:
  scrape_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']

  - job_name: 'nodeexporter'
    static_configs:
      - targets: ['nodeexporter:9100','192.168.1.131:9100']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080','192.168.1.131:8880']

  # Synology SNMP is slow and its values change slowly, so poll less often
  - job_name: 'snmp'
    scrape_interval: 30s
    scrape_timeout: 20s
    static_configs:
      - targets: ['192.168.1.254']
    metrics_path: /snmp
    params:
      module: [synology]
      auth: [snmpv3]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - source_labels: [__param_target]
        regex: (.*)
        replacement: snmp:9116
        target_label: __address__

  - job_name: 'speedtest'
    scrape_interval: 60m
    scrape_timeout:  60s
    metrics_path: /metrics
    static_configs:
      - targets: ['speedtest:9877']

  - job_name: 'watchtower'
    scrape_interval: 60s
    metrics_path: /v1/metrics
    # Token file lives only on the NAS next to this file, see docker-compose.yml
    authorization:
      credentials_file: /etc/prometheus/watchtower.token
    static_configs:
      # Both hosts use the same API token
      - targets: ['watchtower:8080','192.168.1.131:8008']

  - job_name: 'uptime-kuma'
    scrape_interval: 60s
    basic_auth:
      username: prometheus
      password_file: /etc/prometheus/kuma.apikey
    static_configs:
      - targets: ['uptime-kuma:3001']

  - job_name: 'hyperbackup'
    scrape_interval: 5m
    static_configs:
      - targets: ['hyperbackup:9112']

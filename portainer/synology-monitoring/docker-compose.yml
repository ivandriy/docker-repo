version: "3.2"

services:
  grafana:
    image: grafana/grafana:13.3.0
    container_name: grafana
    hostname: grafana
    mem_limit: 512m
    cpu_shares: 512
    security_opt:
      - no-new-privileges:true
    user: 1026:100
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:3000/api/health
    ports:
      - 3340:3000
    volumes:
      - /volume1/docker/synology-monitoring/grafana:/var/lib/grafana:rw
      # Alert rules from grafana-alerting/ in this repo; copy edits to the NAS folder
      - /volume1/docker/synology-monitoring/grafana-alerting:/etc/grafana/provisioning/alerting:ro
    environment:
      TZ: Europe/Kiev
      # Alert links (Rule, Silence) are built from this; without it they say localhost:3000
      GF_SERVER_ROOT_URL: https://grafana.${LOCAL_DOMAIN}
    # always, not unless-stopped: Synology's shutdown script stops containers by name,
    # so unless-stopped ones are not restarted by dockerd after a NAS reboot
    restart: always
    labels:
       # proxy settings   
      - "traefik.enable=true"    
      - "traefik.http.routers.grafana.entrypoints=https"
      - "traefik.http.routers.grafana.rule=Host(`grafana.${LOCAL_DOMAIN}`)"
      - "traefik.http.routers.grafana.middlewares=whitelist@file"
      - "traefik.http.routers.grafana.tls=true"
      - "traefik.http.routers.grafana.tls.certresolver=mydnschallenge"
      - "traefik.http.routers.grafana.tls.domains[0].main=${LOCAL_DOMAIN}"
      - "traefik.http.routers.grafana.tls.domains[0].sans=*.${LOCAL_DOMAIN}"
      # homepage integration
      - homepage.group=Monitoring
      - homepage.name=Grafana
      - homepage.icon=grafana.png
      - homepage.href=https://grafana.${LOCAL_DOMAIN}
      - homepage.description=Monitoring dashboards
      - homepage.widget.type=grafana
      # Grafana 11+ dropped the legacy alerts API that version 1 reads
      - homepage.widget.version=2
      - homepage.widget.url=http://grafana:3000
      - homepage.widget.username=${GRAFANA_USERNAME}
      - homepage.widget.password=${GRAFANA_PASSWORD}
      # auto update docker     
      - "com.centurylinklabs.watchtower.enable=true"

  prometheus:
    image: prom/prometheus:v3.16.0
    command:
      - '--storage.tsdb.retention.time=60d'
      - '--config.file=/etc/prometheus/prometheus.yml'
    container_name: prometheus
    ports:
    - 9090:9090
    hostname: prometheus
    mem_limit: 1g
    cpu_shares: 768
    security_opt:
      - no-new-privileges=true
    user: 1026:100
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:9090/ || exit 1
    volumes:
      - /volume1/docker/synology-monitoring/prometheus:/prometheus:rw
      - /volume1/docker/synology-monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Watchtower HTTP API token, kept only on the NAS (same value as the watchtower stack env)
      - /volume1/docker/synology-monitoring/watchtower.token:/etc/prometheus/watchtower.token:ro
      # Uptime Kuma API key for /metrics (Kuma Settings > API Keys), also NAS-only
      - /volume1/docker/synology-monitoring/kuma.apikey:/etc/prometheus/kuma.apikey:ro
      # Home Assistant long-lived token for /api/prometheus, NAS-only
      - /volume1/docker/synology-monitoring/ha.token:/etc/prometheus/ha.token:ro
    restart: always
    labels:
       # proxy settings       
      - "traefik.enable=true"    
      - "traefik.http.routers.prometheus.entrypoints=https"
      - "traefik.http.routers.prometheus.rule=Host(`prometheus.${LOCAL_DOMAIN}`)"
      - "traefik.http.routers.prometheus.middlewares=whitelist@file"
      - "traefik.http.routers.prometheus.tls=true"
      - "traefik.http.routers.prometheus.tls.certresolver=mydnschallenge"
      - "traefik.http.routers.prometheus.tls.domains[0].main=${LOCAL_DOMAIN}"
      - "traefik.http.routers.prometheus.tls.domains[0].sans=*.${LOCAL_DOMAIN}"
      # homepage integration
      - homepage.group=Monitoring
      - homepage.name=Prometheus
      - homepage.icon=prometheus.png
      - homepage.href=https://prometheus.${LOCAL_DOMAIN}
      - homepage.description=Metrics exporter
      - homepage.widget.type=prometheus
      - homepage.widget.url=http://prometheus:9090      
      # auto update docker           
      - "com.centurylinklabs.watchtower.enable=true"

  node-exporter:
    image: prom/node-exporter:v1.12.1
    command:
      - --collector.disable-defaults
      - --collector.stat
      - --collector.time
      - --collector.cpu
      - --collector.loadavg
      - --collector.hwmon
      - --collector.meminfo
      - --collector.diskstats
    container_name: node_exporter
    hostname: nodeexporter
    mem_limit: 256m
    mem_reservation: 64m
    cpu_shares: 512
    security_opt:
      - no-new-privileges=true
    read_only: true
    user: 1026:100
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:9100/
    restart: always
    labels:
      - "com.centurylinklabs.watchtower.enable=true"


  snmp-exporter:
    image: prom/snmp-exporter:v0.31.0
    command:
      - '--config.file=/etc/snmp_exporter/snmp.yml'
    container_name: snmp_exporter
    hostname: snmp
    mem_limit: 256m
    mem_reservation: 64m
    cpu_shares: 512
    security_opt:
      - no-new-privileges:true
    read_only: true
    user: 1026:100
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:9116/ || exit 1
    volumes:
      - /volume1/docker/synology-monitoring/snmp.yml:/etc/snmp_exporter/snmp.yml:ro
    restart: always
    labels:
      - "com.centurylinklabs.watchtower.enable=true"   

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    command:
      - '--docker_only=true'
      - "--housekeeping_interval=30s"
      - "--max_housekeeping_interval=35s"
      - "--global_housekeeping_interval=30s"
      - "--event_storage_event_limit=default=0"
      - "--event_storage_age_limit=default=0"
      - "--store_container_labels=false"
      - "--storage_duration=1m0s"
      - "--allow_dynamic_housekeeping=true"
    container_name: cadvisor
    hostname: cadvisor
    mem_limit: 256m
    mem_reservation: 64m
    cpu_shares: 512
    security_opt:
      - no-new-privileges=true
    read_only: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: always
    labels:
      # proxy settings        
      - "traefik.enable=true"    
      - "traefik.http.routers.cadvisor.entrypoints=https"
      - "traefik.http.routers.cadvisor.rule=Host(`cadvisor.${LOCAL_DOMAIN}`)"
      - "traefik.http.routers.cadvisor.middlewares=whitelist@file"
      - "traefik.http.routers.cadvisor.tls=true"
      - "traefik.http.routers.cadvisor.tls.certresolver=mydnschallenge"
      - "traefik.http.routers.cadvisor.tls.domains[0].main=${LOCAL_DOMAIN}"
      - "traefik.http.routers.cadvisor.tls.domains[0].sans=*.${LOCAL_DOMAIN}"
      # homepage integration
      - homepage.group=Monitoring
      - homepage.name=cAdvisor
      - homepage.icon=cadvisor.png
      - homepage.href=https://cadvisor.${LOCAL_DOMAIN}
      - homepage.description=Docker monitoring      
      - "com.centurylinklabs.watchtower.enable=true"

  # Hyper Backup task results as metrics. The script is hyperbackup-exporter.py in this
  # repo; copy edits to the NAS folder. Group 101 (administrators) can read the schedules.
  hyperbackup-exporter:
    image: python:3.13.18-alpine
    command: ["python", "-u", "/app/exporter.py"]
    container_name: hyperbackup_exporter
    hostname: hyperbackup
    mem_limit: 64m
    cpu_shares: 256
    security_opt:
      - no-new-privileges=true
    read_only: true
    user: 1026:100
    group_add:
      - "101"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9112/metrics')"]
    volumes:
      - /volume1/docker/synology-monitoring/hyperbackup-exporter.py:/app/exporter.py:ro
      - /var/packages/HyperBackup/var/last_result:/hb/last_result:ro
      - /var/packages/HyperBackup/etc/synobackup.conf:/hb/synobackup.conf:ro
      - /usr/syno/etc/synoschedule.d/root:/hb/schedule:ro
    restart: always

  # HTTPS and DNS probes; modules in blackbox.yml, targets in prometheus.yml
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.29.1
    command:
      - '--config.file=/etc/blackbox_exporter/blackbox.yml'
    container_name: blackbox_exporter
    hostname: blackbox
    mem_limit: 64m
    cpu_shares: 256
    security_opt:
      - no-new-privileges:true
    read_only: true
    user: 1026:100
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:9115/ || exit 1
    volumes:
      - /volume1/docker/synology-monitoring/blackbox.yml:/etc/blackbox_exporter/blackbox.yml:ro
    restart: always
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  # Both AdGuard Home instances. ADGUARD_USERNAME is stack env (same login on both);
  # the passwords file is NAS-only, one password per server, comma separated.
  adguard-exporter:
    image: ghcr.io/henrywhitaker3/adguard-exporter:v1.2.3
    container_name: adguard_exporter
    hostname: adguard-exporter
    mem_limit: 64m
    cpu_shares: 256
    security_opt:
      - no-new-privileges:true
    read_only: true
    user: 1026:100
    environment:
      ADGUARD_SERVERS: http://192.168.1.254:9080,http://192.168.1.131:9080
      ADGUARD_USERNAMES: ${ADGUARD_USERNAME},${ADGUARD_USERNAME}
      ADGUARD_PASSWORDS_FILE: /run/secrets/adguard_passwords
      INTERVAL: 30s
    volumes:
      - /volume1/docker/synology-monitoring/adguard.passwords:/run/secrets/adguard_passwords:ro
    restart: always
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

networks:
  default:
    name: containers_bridge
    external: true
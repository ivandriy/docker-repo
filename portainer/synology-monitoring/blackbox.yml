# Blackbox exporter modules. Live copy: /volume1/docker/synology-monitoring/blackbox.yml,
# copy edits there and restart blackbox_exporter. Targets are in prometheus.yml.
modules:
  # HTTPS page answers 2xx. Also exports probe_ssl_earliest_cert_expiry.
  http_2xx:
    prober: http
    timeout: 10s
    http:
      preferred_ip_protocol: ip4
      follow_redirects: true
      fail_if_not_ssl: true

  # AdGuard answers an A query with NOERROR
  dns_adguard:
    prober: dns
    timeout: 5s
    dns:
      transport_protocol: udp
      preferred_ip_protocol: ip4
      query_name: google.com
      query_type: A
      valid_rcodes: [NOERROR]
      validate_answer_rrs:
        fail_if_none_matches_regexp: ['.*\tIN\tA\t.*']

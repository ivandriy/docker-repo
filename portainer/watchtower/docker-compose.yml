services:
  watchtower:
    image: nickfedor/watchtower:1
    restart: unless-stopped
    container_name: watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "${HTTP_PORT}:8080"
    # Check for updates every couple hours: (3h * 60m * 60s)
    command: --interval 10800
    environment:
      - TZ=Europe/Kiev
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_INCLUDE_RESTARTING=true
      # user and password must be URL-encoded (e.g. @ -> %40)
      - WATCHTOWER_NOTIFICATION_URL=smtp://${WATCHTOWER_NOTIFICATION_EMAIL_SERVER_USER}:${WATCHTOWER_NOTIFICATION_EMAIL_SERVER_PASSWORD}@${WATCHTOWER_NOTIFICATION_EMAIL_SERVER}:587/?from=${WATCHTOWER_NOTIFICATION_EMAIL_FROM}&to=${WATCHTOWER_NOTIFICATION_EMAIL_TO}&encryption=ExplicitTLS
      - WATCHTOWER_NOTIFICATION_TITLE_TAG=Watchtower
      - WATCHTOWER_NOTIFICATIONS_DELAY=2
      - WATCHTOWER_HTTP_API_TOKEN=${WATCHTOWER_HTTP_API_TOKEN}
      - WATCHTOWER_HTTP_API_METRICS=true
    labels:
      # homepage integration
      - homepage.group=Network
      - homepage.name=Watchtower
      - homepage.icon=watchtower.png
      - homepage.description=Docker auto updates
      - homepage.widget.type=watchtower
      # container port, not the published HTTP_PORT
      - homepage.widget.url=http://watchtower:8080
      - homepage.widget.key=${WATCHTOWER_HTTP_API_TOKEN}

networks:
  default:
    name: containers_bridge
    external: true
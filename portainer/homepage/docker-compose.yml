version: "3.8"
services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    ports:
      - 3000:3000
    environment:
      # Homepage v1+ rejects requests for hosts not listed here
      - HOMEPAGE_ALLOWED_HOSTS=homepage.${LOCAL_DOMAIN},192.168.1.254:3000
    volumes:
      - /volume1/docker/homepage/config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock
    # The disk widget reads /app/config, which is on volume1. Don't bind-mount
    # /volume1 itself: Synology's boot start fails on it (error 117).
    # "always" because Synology's shutdown stops containers by hand, so
    # unless-stopped never brings it back after a reboot.
    restart: always
    labels:
      - "traefik.enable=true"    
      - "traefik.http.routers.homepage.entrypoints=https"
      - "traefik.http.routers.homepage.rule=Host(`homepage.${LOCAL_DOMAIN}`)"
      - "traefik.http.routers.homepage.middlewares=whitelist@file"
      - "traefik.http.routers.homepage.tls=true"
      - "traefik.http.routers.homepage.tls.certresolver=mydnschallenge"
      - "traefik.http.routers.homepage.tls.domains[0].main=${LOCAL_DOMAIN}"
      - "traefik.http.routers.homepage.tls.domains[0].sans=*.${LOCAL_DOMAIN}"
      - "com.centurylinklabs.watchtower.enable=false"
networks:
  default:
    name: containers_bridge
    external: true